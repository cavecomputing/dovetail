[package]
name = "dovetail"
version = "0.2.3"
edition = "2024"
license = "MIT"

[dependencies]
directories = "6.0.0"
# Both pinned to the exact versions ui/text_editor.rs was copied from: that file is iced_widget's
# text editor with our changes, so iced must not move under it until the copy is redone.
iced = { version = "=0.14.0", features = ["tokio", "advanced", "tiny-skia", "wgpu"] }
iced_widget = "=0.14.2"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Checks YAML files as they are typed, giving the line and column of the first problem.
saphyr-parser = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The split review's live diff: lines, then words, then letters, with a deadline so a pathological
# pair of texts can't run away.
similar = "3.2.0"
toml = "1.1.8"
# Word bounds as cosmic-text finds them for a double click's selection (iced already uses it).
unicode-segmentation = "1.13.3"

[target.'cfg(unix)'.dependencies]
# The atexit hook that saves when macOS quits the app from the Dock or at logout (already in the build).
libc = "0.2"
# Hears SIGTERM, SIGHUP and SIGINT on a thread of its own, so the app saves before logout ends it.
signal-hook = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Hears files dropped on the window under Wayland, through our patched copy (iced already uses it).
smithay-clipboard = "0.7.3"

[target.'cfg(windows)'.dependencies]
# The hidden window that hears WM_ENDSESSION, so the app saves before logout ends it (winit uses it).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Points macOS's Quit at closing the window, so quitting waits for the save (rfd already uses both).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

[build-dependencies]
# Puts the app icon inside the Windows .exe (Explorer, "Open with", pinned taskbar buttons).
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
# A tiny local HTTP server in the assistant client's tests; the app already runs on tokio via iced.
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

# The Wayland clipboard with drops added: Hyprland tells only its data device about a drag (see
# vendor/smithay-clipboard/README.md).
[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }
