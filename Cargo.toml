[package]
name = "dovetail"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
directories = "6.0.0"
iced = { version = "0.14", features = ["tokio", "advanced", "tiny-skia", "wgpu"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Checks YAML files as they are typed, giving the line and column of the first problem.
saphyr-parser = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiktoken-rs = "0.12.1"
toml = "1.1.8"
# Word bounds as cosmic-text finds them for a double click's selection (iced already uses it).
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Points macOS's Quit at closing the window, so quitting waits for the save (rfd already uses both).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

[dev-dependencies]
tempfile = "3.27.0"
# A tiny local HTTP server in the assistant client's tests; the app already runs on tokio via iced.
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
