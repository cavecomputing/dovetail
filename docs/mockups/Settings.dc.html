<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.stage{--bg-page:#1d2021;--bg-surface:#282828;--bg-raised:#32302f;--bg-inset:#3c3836;--border:#3c3836;--border-soft:#32302f;--fg:#ebdbb2;--fg-muted:#a89984;--fg-subtle:#7c6f64;--accent:#fabd2f;--accent-text:#fabd2f;--accent-cool:#83a598;--accent-warm:#fe8019;--accent-rose:#d3869b;--accent-aqua:#8ec07c;--font-mono:"JetBrainsMono Nerd Font","JetBrains Mono",ui-monospace,monospace;--radius-sm:6px}
.stage.light{--bg-page:#f9f5d7;--bg-surface:#fbf1c7;--bg-raised:#f2e5bc;--bg-inset:#ebdbb2;--border:#e0d3ac;--border-soft:#ebdbb2;--fg:#3c3836;--fg-muted:#665c54;--fg-subtle:#7c6f64;--accent:#b57614;--accent-text:#8a5a0e;--accent-cool:#076678;--accent-warm:#af3a03;--accent-rose:#8f3f71;--accent-aqua:#427b58}
.wc{width:28px;height:24px;display:grid;place-items:center;padding:0;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--fg-muted);cursor:pointer}
.wc:hover{background:var(--border);color:var(--fg)}
.wc svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:12px;color:var(--fg-subtle)}
.sec::after{content:"";flex:1;height:1px;background:var(--border)}
.row{display:grid;grid-template-columns:200px minmax(0,1fr);align-items:center;gap:16px;min-height:30px;font-size:13px}
.row > span:first-child{color:var(--fg-muted)}
.v{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.v:hover,.v:focus-visible{border-color:var(--border);outline:none}
.v.dd::after{content:"▾";font-size:10px;color:var(--fg-subtle)}
.v.on{color:var(--accent-text)}
.v.off{color:var(--fg-subtle)}
.v.mute{color:var(--fg-muted)}
.sep{color:var(--fg-subtle)}
.hint{font-size:12px;color:var(--fg-subtle)}
</style>
</helmet>
<div class="stage {{themeClass}}" style="width: 1000px; height: 900px; box-sizing: border-box; background: var(--bg-surface); color: var(--fg); font-family: var(--font-mono); display: flex; flex-direction: column;">

<header style="display: flex; align-items: center; justify-content: flex-end; gap: 6px; height: 32px; padding: 0 4px; user-select: none;">
<button class="wc" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
<button class="wc" aria-label="Maximize"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg></button>
<button class="wc" aria-label="Close window"><svg viewBox="0 0 24 24"><path d="M7 7l10 10"></path><path d="M17 7L7 17"></path></svg></button>
</header>

<main style="flex: 1; overflow: auto; padding: 40px 24px;">
<div style="max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">

<section>
<p class="sec">appearance</p>
<div class="row"><span>Theme</span><span><button class="v dd">Gruvbox dark</button></span></div>
<div class="row"><span>Font</span><span><button class="v dd">JetBrainsMono Nerd Font</button></span></div>
<div class="row"><span>Font size</span><span><button class="v">15</button><span class="hint">px</span></span></div>
<div class="row"><span>Reading mode</span><span><button class="v on">comfort</button><span class="sep">/</span><button class="v off">full width</button><span class="sep" style="margin: 0 6px;">·</span><button class="v">80</button><span class="hint">chars</span></span></div>
</section>

<section>
<p class="sec">editor</p>
<div class="row"><span>Tab inserts</span><span><button class="v">4</button><span class="hint">spaces, never tabs</span></span></div>
<div class="row"><span>Word wrap</span><span><button class="v on">on</button></span></div>
<div class="row"><span>XML and macro colour</span><span><button class="v on">on</button></span></div>
</section>

<section>
<p class="sec">saving</p>
<div class="row"><span>Autosave</span><span><button class="v dd">as you type</button></span></div>
<div class="row"><span>Projects folder</span><span><button class="v">~/Documents/Word Designer</button></span></div>
</section>

<section>
<p class="sec">claude</p>
<div class="row"><span>API key</span><span><button class="v mute">••••••••••••4f2a</button><span class="hint">in keyring</span></span></div>
<div class="row"><span>Model</span><span><button class="v dd">[CLAUDE MODEL]</button></span></div>
</section>

<section>
<p class="sec">window</p>
<div class="row"><span>Window controls</span><span><button class="v dd">auto</button><span class="hint">hidden on tiling WMs</span></span></div>
</section>

</div>
</main>

<footer role="status" style="display: flex; align-items: center; gap: 16px; height: 24px; padding: 0 12px; border-top: 1px solid var(--border); background: var(--bg-page); font-size: 11px; color: var(--fg-muted); white-space: nowrap;">
<span style="display: flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent-aqua);"></span>~/.config/[app]/settings.toml</span>
<span style="flex: 1;"></span>
<span>changes apply instantly</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1000,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'light' : '' };
  }
}
</script>
</body>
</html>
